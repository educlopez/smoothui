name: release-please

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Deny by default and let the job ask for what it needs, so a second job added
# here later does not silently inherit write access.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-root manifest packages use `<path>--...` output names.
    outputs:
      cli_release_created: ${{ steps.release.outputs['packages/cli--release_created'] }}
      cli_tag_name: ${{ steps.release.outputs['packages/cli--tag_name'] }}
      cli_release_sha: ${{ steps.release.outputs['packages/cli--sha'] }}
    permissions:
      contents: write # Create the release commit, tag and GitHub release
      pull-requests: write # Open and update the release PR
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The release PR is merged by hand, on purpose. This is what shadcn/ui
      # does: the version bump and changelog are the last chance to look at what
      # is about to be published, and that review is worth more than the clicks
      # it costs.
      #
      # Auto-merging it was tried and removed. It could never work here anyway:
      # CI and Secret Scan on the release PR finish with conclusion
      # `action_required` and never run, because the PR is opened by
      # github-actions[bot], so the PR sits at UNSTABLE forever and
      # `gh pr merge --auto` refuses with "Pull request is in unstable status".
      # Only a blind unconditional merge got it through, which is precisely the
      # thing worth not doing to a published release.
      #
      # The risk this trades into is forgetting: an unmerged release PR is what
      # once left the package stale at 3.5.1 while main had moved on. It is
      # visible in the PR list, so the fix is to look there before saying a fix
      # has shipped.
      - name: Report the pending release PR
        if: steps.release.outputs.pr
        run: |
          echo "::notice title=Release PR ready::$(jq -r '"#\(.number) \(.title)"' <<<"$PR_JSON") — merge it to publish."
        env:
          PR_JSON: ${{ steps.release.outputs.pr }}

  publish-cli:
    name: Publish smoothui-cli
    needs: release-please
    if: needs.release-please.outputs.cli_release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-cli
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing and provenance
    steps:
      - name: Checkout the exact CLI release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-please.outputs.cli_tag_name }}
          persist-credentials: false

      - name: Verify the checked-out release commit
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.release-please.outputs.cli_release_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"

      # Use only the runner's trusted Ruby/Psych stdlib before executing code
      # from the candidate dependency graph.
      - name: Test lockfile validator regressions
        run: ruby scripts/validate-lockfile.test.rb

      - name: Validate pnpm-lock.yaml before install
        run: ruby scripts/validate-lockfile.rb

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Pin the Trusted Publishing npm client
        # npm 11.5.1 is the minimum OIDC-capable publisher and is exact-pinned.
        # zizmor: ignore[adhoc-packages]
        run: |
          npm install --global npm@11.5.1 --ignore-scripts
          test "$(npm --version)" = "11.5.1"
          test "$(pnpm --version)" = "11.1.2"

      # A filtered install avoids executing unrelated app lifecycle scripts and
      # therefore does not expose NUCLEO_LICENSE_KEY to this publisher.
      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile --filter smoothui-cli...

      - name: Validate CLI package logic
        run: |
          pnpm --filter smoothui-cli exec vitest run --root ../.. --config vitest.risk.config.ts packages/cli
          pnpm typecheck:cli
          pnpm --filter smoothui-cli exec ultracite check .

      - name: Build CLI once
        run: pnpm build:cli

      - name: Pack and verify the release tarball
        env:
          EXPECTED_TAG: ${{ needs.release-please.outputs.cli_tag_name }}
        run: |
          pnpm pack:cli
          pnpm verify:cli-package -- \
            --expected-tag "$EXPECTED_TAG"

      - id: tarball
        name: Resolve the verified tarball
        run: |
          TARBALL="packages/cli/.release/artifacts/$(node -e "const [entry] = JSON.parse(require('node:fs').readFileSync('packages/cli/.release/cli-pack.json', 'utf8')); process.stdout.write(entry.filename)")"
          test -f "$TARBALL"
          echo "path=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the exact verified tarball
        env:
          TARBALL: ${{ steps.tarball.outputs.path }}
        # This is the locally built, integrity-verified tarball from the prior
        # step, not an ad-hoc registry dependency.
        # zizmor: ignore[adhoc-packages]
        run: |
          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          SMOKE_DIRECTORY=$(mktemp -d)
          trap 'rm -rf "$SMOKE_DIRECTORY"' EXIT
          npm install --prefix "$SMOKE_DIRECTORY" --ignore-scripts --no-audit --no-fund "$TARBALL"
          "$SMOKE_DIRECTORY/node_modules/.bin/smoothui" --help | grep -F "Usage: npx smoothui <command> [options]"
          test "$("$SMOKE_DIRECTORY/node_modules/.bin/smoothui" --version)" = "$CLI_VERSION"

      - name: Refuse to republish an existing npm version
        env:
          TARBALL: ${{ steps.tarball.outputs.path }}
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          set +e
          VIEW_OUTPUT=$(npm view "smoothui-cli@$VERSION" version --json 2>&1)
          VIEW_STATUS=$?
          set -e
          if [ "$VIEW_STATUS" -eq 0 ]; then
            echo "::error title=Version already published::smoothui-cli@$VERSION already exists; refusing to republish $TARBALL."
            exit 1
          fi
          if ! grep -q "E404" <<<"$VIEW_OUTPUT"; then
            echo "::error title=npm registry check failed::$VIEW_OUTPUT"
            exit "$VIEW_STATUS"
          fi

      - name: Publish the exact verified tarball with provenance
        env:
          TARBALL: ${{ steps.tarball.outputs.path }}
        run: npm publish "$TARBALL" --access public --provenance
