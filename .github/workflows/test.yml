name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deny by default and let each job ask for what it needs, the way astro, tailwind
# and hono set theirs up. Every job here only reads the checkout, so nothing has
# to escalate.
permissions: {}

# nucleo-core-fill-24 runs a license-check preinstall (allowlisted in
# pnpm-workspace.yaml allowBuilds) that fails without this key.
env:
  NUCLEO_LICENSE_KEY: ${{ secrets.NUCLEO_LICENSE_KEY }}

jobs:
  lockfile-audit:
    name: Lockfile Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Required by actions/checkout
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # ubuntu-latest includes trusted system Ruby and Psych. These steps use
      # only that stdlib: no package or code from the candidate lock is loaded.
      - name: Test lockfile validator regressions
        run: ruby scripts/validate-lockfile.test.rb

      # This must run before any candidate dependencies are installed or
      # executed. The validator uses only the runner's trusted Ruby/Psych stdlib.
      - name: Validate pnpm-lock.yaml (HTTPS-only, no exotic sources)
        run: ruby scripts/validate-lockfile.rb

  lint:
    name: Lint
    needs: lockfile-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Required by actions/checkout
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm check

  typecheck:
    name: Typecheck
    needs: lockfile-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Required by actions/checkout
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    needs: lockfile-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Required by actions/checkout
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Verify registry output (no workspace import leaks)
        working-directory: apps/docs
        run: pnpm exec tsx scripts/verify-registry.mts

      # Compiles what the registry actually serves, which structural checks
      # cannot do. shadcn/ui scaffolds a real app for the same reason.
      - name: Verify registry output compiles when installed
        working-directory: apps/docs
        run: pnpm exec tsx scripts/verify-install.mts

      # The counts are committed so client components and MDX frontmatter can
      # import them. Checked like a lockfile, so marketing copy cannot silently
      # drift from the catalogue again.
      - name: Verify component/block counts are current
        working-directory: apps/docs
        run: pnpm exec tsx scripts/generate-counts.mts --check

  build:
    name: Build
    needs: lockfile-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # Required by actions/checkout
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify CLI
        run: pnpm exec tsup && node dist/index.js list --json
