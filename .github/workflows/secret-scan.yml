# Mirrors the shared gates in educlopez/github-actions-workflows.
#
# This repo is public and that one is private, and GitHub does not let a public
# repo call a reusable workflow from a private repo — the run fails before any
# job starts. So the steps live here. Keep them in sync with the shared repo.

name: Secret Scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Required by actions/checkout
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the PR commit range / full-repo scan can walk it.
          fetch-depth: 0
          persist-credentials: false

      - name: 📦 Install gitleaks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          bin_dir="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" \
            | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/gitleaks" version

      - name: 🕵️ Scan for secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "Scanning PR commit range: ${BASE_SHA}..${HEAD_SHA}"
            gitleaks detect --source . --redact --no-banner --verbose \
              --log-opts="${BASE_SHA}..${HEAD_SHA}"
          else
            echo "Scanning full repository history"
            gitleaks detect --source . --redact --no-banner --verbose
          fi
