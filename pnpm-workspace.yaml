packages:
  - "apps/*"
  - "packages/*"
  - "packages/smoothui/components/*"
  - "packages/smoothui/blocks/*/*"
  - "packages/smoothui/blocks/shared"
  - "packages/smoothui/templates/*"

allowBuilds:
  esbuild: true
  msw: true
  nucleo-core-fill-24: true
  sharp: true

overrides:
  react: "^19.2.1"
  react-dom: "^19.2.1"
  # Pin radix-ui to one exact version tree-wide: packages/shadcn-ui declares
  # "latest" (regenerated by bump-ui), and mixed resolutions create duplicate
  # Radix context providers that break components at runtime. Bump manually.
  radix-ui: "1.4.3"
  shiki: "^4.0.2"
  "@shikijs/types": "^4.0.2"
  glob: ">=10.5.0"
  "@types/react": "^19.2.7"
  "@types/react-dom": "^19.2.3"
  csstype: "^3.2.3"
  lodash: ">=4.18.0"
  qs: ">=6.16.0 <7"
  diff: ">=8.0.3"
  "@isaacs/brace-expansion": ">=5.0.1"
  "@modelcontextprotocol/sdk": ">=1.26.0"
  mdast-util-to-hast: ">=13.2.1"
  rollup: ">=4.59.0"
  minimatch: ">=10.2.3"
  ajv: ">=8.18.0"
  hono: ">=4.13.5 <5"
  "@hono/node-server": ">=1.19.15 <2"
  # Advisory floors, each capped below the next major. A security floor exists
  # to raise a patch level, not to smuggle a breaking change past review: an
  # uncapped `undici: ">=7.29.0"` resolved to 8.x and broke jsdom 29, which
  # requires undici 7. Lift a cap deliberately, never as a side effect.
  fast-uri: ">=3.1.6 <4"
  ip-address: ">=10.3.1 <11"
  postcss: ">=8.5.18"
  body-parser: ">=2.3.0 <3"
  js-yaml: ">=4.3.2 <5"
  undici: ">=7.29.0 <8"
  "@babel/core": ">=7.29.6 <8"
  esbuild: ">=0.28.1 <0.29"
  "@octokit/request": ">=8.4.1"
  "@octokit/plugin-paginate-rest": ">=9.2.2"
  "@octokit/request-error": ">=5.1.1"
  picomatch: ">=4.0.4"
  path-to-regexp: ">=8.4.0"
  brace-expansion: ">=5.0.8"
  yaml: ">=2.8.3"
  # Advisory floor is 7.3.5. Capped below 8 on purpose: vite only enters as a
  # peer of vitest 4.1.11 and fumadocs-mdx, and a major jump is not something a
  # security floor should smuggle in. Lift the cap deliberately, with the test
  # suite as the check.
  vite: ">=7.3.6 <8"
  lodash-es: ">=4.18.0"
  "nanoid@3": ">=3.3.18 <4"
  "postcss-selector-parser@7": ">=7.1.3 <8"
  browserslist: ">=4.28.7 <5"
  baseline-browser-mapping: ">=2.11.0 <3"
  # Next 16.3.3 allows ^0.35.3; pin its image processor to the patched
  # release so an older lockfile cannot retain the vulnerable 0.35.3.
  "next>sharp": "0.35.4"
  "webpack-bundle-analyzer>ws": "7.5.11"

# SECURITY: supply-chain hardening (npm-security-best-practices)
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - "@educlopez/*"
blockExoticSubdeps: true
